<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智驾数据闭环 · 业务八环节环</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 0.75rem;
    }
    .eyebrow, h1, .lede { display: none; }
    .frame { max-width: 1160px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .lede {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 40rem;
    }
    svg { width: 100%; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · 小周谈智驾闭环</p>
    <h1>业务八环节环</h1>
    <p class="lede">采集 → 交付 → 训练 → 评测 → OTA → 回传 → 分析 → 挖掘，顺时针一圈；每站向湖仓沉淀状态。挖掘为变速箱焦点。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="ad-loop-8-title ad-loop-8-desc">
        <title id="ad-loop-8-title">业务八环节环</title>
        <desc id="ad-loop-8-desc">八个业务环节顺时针闭环，中心湖仓为单一事实源；数据挖掘为焦点变速箱，仿真评测先于 OTA，问题分析后于回传。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Phase eyebrows (outside ring) -->
        <text x="780" y="56" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">① 数据供给</text>
        <text x="900" y="480" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">② 模型进化</text>
        <text x="120" y="700" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">③ 车队反馈</text>
        <text x="80" y="120" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">④ 数据再生</text>

        <!-- Ring arcs (clockwise, R=280, C=560,360) -->
        <path d="M636.000 90.512 A280 280 0 0 1 721.551 131.306" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M786.945 196.000 A280 280 0 0 1 838.026 326.808" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M838.165 392.000 A280 280 0 0 1 787.646 523.026" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M722.530 588.000 A280 280 0 0 1 637.154 629.160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M484.000 629.488 A280 280 0 0 1 398.449 588.694" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M333.055 524.000 A280 280 0 0 1 281.974 393.192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M281.835 328.000 A280 280 0 0 1 332.354 196.974" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M397.470 132.000 A280 280 0 0 1 482.846 90.840" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Write-back spokes -->
        <path d="M560.000 112.000 L560.000 306.000" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M725.990 194.010 L612.243 307.757" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M764.000 360.000 L664.000 360.000" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M725.990 525.990 L612.243 412.243" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M560.000 608.000 L560.000 414.000" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M394.010 525.990 L507.757 412.243" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M356.000 360.000 L456.000 360.000" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <path d="M394.010 194.010 L507.757 307.757" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

        <!-- Curated spoke labels -->
        <rect x="572" y="200" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="592" y="212" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">沉淀</text>
        <rect x="628" y="456" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="648" y="468" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">度量</text>
        <rect x="420" y="220" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="232" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回补</text>

        <!-- Stations -->
        <!-- S0 数据采集 -->
        <rect x="484" y="48" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="76" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据采集</text>
        <text x="560" y="94" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">road + fleet</text>

        <!-- S1 处理交付 -->
        <rect x="680" y="132" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="756" y="160" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">处理交付</text>
        <text x="756" y="178" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">label · version</text>

        <!-- S2 模型训练 -->
        <rect x="764" y="328" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="840" y="356" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">模型训练</text>
        <text x="840" y="374" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E2E / stack</text>

        <!-- S3 仿真评测 -->
        <rect x="680" y="524" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="756" y="552" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">仿真评测</text>
        <text x="756" y="570" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">before OTA</text>

        <!-- S4 OTA部署 -->
        <rect x="484" y="608" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="636" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">OTA 部署</text>
        <text x="560" y="654" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fleet rollout</text>

        <!-- S5 数据回传 -->
        <rect x="288" y="524" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="364" y="552" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据回传</text>
        <text x="364" y="570" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trigger · shadow</text>

        <!-- S6 问题分析 -->
        <rect x="204" y="328" width="152" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="356" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">问题分析</text>
        <text x="280" y="374" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">after uplink</text>

        <!-- S7 数据挖掘 · focal -->
        <rect x="288" y="132" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="364" y="160" fill="#bf4520" font-size="12" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据挖掘</text>
        <text x="364" y="178" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gearbox · dual-out</text>

        <!-- Hub -->
        <rect x="462" y="312" width="196" height="96" rx="8" fill="#2d3142"/>
        <text x="560" y="352" fill="#f5f5f5" font-size="16" font-weight="600"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">湖仓底座</text>
        <text x="560" y="376" fill="#f5f5f5" opacity="0.72" font-size="9"
              font-family="'Geist Mono', monospace" text-anchor="middle">single source · data_id</text>

        <!-- Editorial callouts -->
        <text x="860" y="560" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif">评测必须先于 OTA</text>
        <text x="40" y="400" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif">分析必须后于回传</text>

        <!-- Legend -->
        <line x1="40" y1="720" x2="1080" y2="720" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="740" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="756" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="60" y="765" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">挖掘焦点</text>

        <rect x="156" y="756" width="14" height="10" rx="2" fill="#2d3142"/>
        <text x="176" y="765" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">湖仓枢纽</text>

        <line x1="276" y1="761" x2="304" y2="761" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="312" y="765" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">环节流转</text>

        <line x1="420" y1="761" x2="448" y2="761" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
        <text x="456" y="765" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">状态沉淀</text>

        <line x1="560" y1="761" x2="588" y2="761" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="596" y="765" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">回补闭环</text>
      </svg>
    </div>
  </div>
</body>
</html>
