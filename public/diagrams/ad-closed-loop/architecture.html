<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智驾数据闭环完整架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 0.75rem;
    }

    .eyebrow, h1, .lede { display: none; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 小周谈智驾闭环</p>
    <h1>智驾数据闭环完整架构</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="ad-closed-loop-arch-title ad-closed-loop-arch-desc">
        <title id="ad-closed-loop-arch-title">智驾数据闭环完整架构</title>
        <desc id="ad-closed-loop-arch-desc">车端经应用层与统一门禁入湖，湖仓为单一事实源，服务层与挖掘流水线咬合，双出口回补训练集或定向采集，评测通过后 OTA 上车。</desc>
        <defs>

          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (bg → zones → arrows → nodes) -->
        <rect x="256" y="56" width="248" height="528" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="328" y="60" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="380" y="72" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">应用平台</text>

        <rect x="528" y="56" width="720" height="528" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="820" y="60" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="872" y="72" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">数据中枢</text>

        <!-- Arrows -->
        <!-- 1 车端 → 应用：回传 -->
        <line x1="208" y1="344" x2="276" y2="344" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="220" y="318" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="240" y="330" fill="#2e5aa8" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">回传</text>

        <path d="M 480,324 H 520 Q 528,324 528,316 V 144 Q 528,136 536,136 H 556"

        <rect x="504" y="196" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="528" y="208" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">入湖</text>

        <!-- 3 入湖 → 湖仓（主路径） -->

        <rect x="676" y="216" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="700" y="228" fill="#bf4520" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              text-anchor="middle">写入</text>

        <!-- 4 湖仓 → StarRocks -->

        <rect x="772" y="318" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="796" y="330" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"

        <!-- 5 湖仓 → 服务 -->

        <text x="300" y="552" fill="#2e5aa8" font-size="12" font-weight="500"

        <text x="872" y="400" fill="#4f5d75" font-size="12" font-weight="500"

        <text x="180" y="504" fill="#4f5d75" font-size="12" font-weight="500"

        <text x="664" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Paimon ODS→ADS</text>
