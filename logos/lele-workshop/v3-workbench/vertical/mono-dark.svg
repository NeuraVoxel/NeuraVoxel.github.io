<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" role="img" aria-labelledby="title desc">
  <title id="title">乐乐工坊</title>
  <desc id="desc">竖排单色深版</desc>
  <defs><style>
      .bench { fill: #2C2416; }
      .edge { fill: #2C2416; opacity: 0.55; }
      .piece { fill: #2C2416; }
      .spark { fill: #2C2416; }
      .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 600; fill: #2C2416; text-anchor: middle; }
      .en { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0.12em; fill: #2C2416; opacity: 0.72; text-anchor: middle; }
</style></defs>
  <g transform="translate(80 72)">
    <!-- bench slab -->
    <rect class="bench" x="-32" y="6" width="64" height="14" rx="4"/>
    <!-- front edge thickness -->
    <rect class="edge" x="-32" y="16" width="64" height="6" rx="2"/>
    <!-- finished piece on bench -->
    <rect class="piece" x="-14" y="-18" width="22" height="22" rx="4"/>
    <!-- completion spark -->
    <circle class="spark" cx="14" cy="-16" r="4.2"/>
  </g>
  <text class="cn" x="80" y="158">乐乐工坊</text>
  <text class="en" x="80" y="180">Lele Workshop</text>
</svg>
