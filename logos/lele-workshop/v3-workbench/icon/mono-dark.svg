<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">乐乐工坊</title>
  <desc id="desc">案上成器单色深版</desc>
  <defs><style>
      .bench { fill: #2C2416; }
      .edge { fill: #2C2416; opacity: 0.55; }
      .piece { fill: #2C2416; }
      .spark { fill: #2C2416; }
</style></defs>
  <g transform="translate(48 52)">
    <!-- bench slab -->
    <rect class="bench" x="-32" y="6" width="64" height="14" rx="4"/>
    <!-- front edge thickness -->
    <rect class="edge" x="-32" y="16" width="64" height="6" rx="2"/>
    <!-- finished piece on bench -->
    <rect class="piece" x="-14" y="-18" width="22" height="22" rx="4"/>
    <!-- completion spark -->
    <circle class="spark" cx="14" cy="-16" r="4.2"/>
  </g>
</svg>
