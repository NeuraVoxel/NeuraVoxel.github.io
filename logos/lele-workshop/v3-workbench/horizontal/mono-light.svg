<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-labelledby="title desc">
  <title id="title">乐乐工坊</title>
  <desc id="desc">横排单色浅版</desc>
  <defs><style>
      .bench { fill: #FFF8F0; }
      .edge { fill: #FFF8F0; opacity: 0.55; }
      .piece { fill: #FFF8F0; }
      .spark { fill: #FFF8F0; }
      .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 600; fill: #FFF8F0; }
      .en { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.12em; fill: #FFF8F0; opacity: 0.78; }
</style></defs>
  <g transform="translate(48 52)">
    <!-- bench slab -->
    <rect class="bench" x="-32" y="6" width="64" height="14" rx="4"/>
    <!-- front edge thickness -->
    <rect class="edge" x="-32" y="16" width="64" height="6" rx="2"/>
    <!-- finished piece on bench -->
    <rect class="piece" x="-14" y="-18" width="22" height="22" rx="4"/>
    <!-- completion spark -->
    <circle class="spark" cx="14" cy="-16" r="4.2"/>
  </g>
  <text class="cn" x="108" y="52">乐乐工坊</text>
  <text class="en" x="110" y="74">Lele Workshop</text>
</svg>
