<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>乐乐工坊 · 概念2 vs 3</title>
<style>
  body{margin:0;padding:2rem;font-family:"PingFang SC",sans-serif;background:#f3ebe3;color:#2c2416}
  h1{font-size:1.4rem;margin:0 0 .35rem}
  p{opacity:.75;margin:0 0 1.5rem;max-width:36rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
  .card{background:#fff8f0;border-radius:12px;padding:1.25rem;text-align:center;border:1px solid rgba(44,36,22,.08)}
  img{width:120px;height:120px}
  .t{font-weight:600;margin-top:.75rem}
  .d{font-size:.85rem;opacity:.7;margin-top:.35rem;line-height:1.4}
</style>
</head>
<body>
<h1>概念对比：2 单锤+乐弧 · 3 锤×工</h1>
<p>各给了主稿 + 一版更干净的变体，避开「父」字交叉结构。</p>
<div class="grid">
  <div class="card"><img src="concept-2-hammer-smile.svg"/><div class="t">2 · 单锤侧笑</div><div class="d">锤略倾，右侧蜜金笑弧与点</div></div>
  <div class="card"><img src="concept-2b-hammer-base-smile.svg"/><div class="t">2b · 单锤底笑</div><div class="d">锤居中直立，笑弧在下方托住</div></div>
  <div class="card"><img src="concept-3-hammer-gong.svg"/><div class="t">3 · 锤 + 工</div><div class="d">左锤右「工」，造物双意</div></div>
  <div class="card"><img src="concept-3b-gong-mallet.svg"/><div class="t">3b · 工中藏锤</div><div class="d">「工」字即锤：顶横是锤头</div></div>
</div>
</body>
</html>
