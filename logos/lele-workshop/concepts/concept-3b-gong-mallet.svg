<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="概念3b：工中藏锤">
  <defs>
    <style>
      .head { fill: #C45C26; }
      .bar { fill: #8B5E3C; }
      .dot { fill: #E8A838; }
    </style>
  </defs>
  <g transform="translate(48 48)">
    <!-- top bar of 工 as mallet head -->
    <rect class="head" x="-28" y="-28" width="56" height="12" rx="3.5"/>
    <!-- vertical stem as handle -->
    <rect class="bar" x="-5" y="-17" width="10" height="36" rx="3"/>
    <!-- bottom bar of 工 -->
    <rect class="bar" x="-22" y="18" width="44" height="8" rx="3"/>
    <circle class="dot" cx="0" cy="2" r="3.8"/>
  </g>
</svg>
