<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="概念2：单锤+乐弧">
  <defs>
    <style>
      .head { fill: #C45C26; }
      .handle { fill: #8B5E3C; }
      .smile { fill: none; stroke: #E8A838; stroke-width: 3.2; stroke-linecap: round; }
      .dot { fill: #E8A838; }
    </style>
  </defs>
  <!-- upright mallet, slightly tilted for life -->
  <g transform="translate(42 50) rotate(-12)">
    <rect class="head" x="-18" y="-34" width="36" height="14" rx="3.5"/>
    <rect class="handle" x="-5" y="-21" width="10" height="48" rx="3.5"/>
  </g>
  <!-- joy arc to the right, like a companion smile -->
  <path class="smile" d="M58 58 Q70 48 78 58"/>
  <circle class="dot" cx="68" cy="42" r="3.2"/>
</svg>
